<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Lista de Filmes</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>🎬 Lista de Filmes</h1>
        <p class="subtitle">Cadastre seus filmes e acompanhe a média das notas</p>
      </header>

      <section class="card form-card">
        <h2>Adicionar Filme</h2>
        <form id="movie-form" class="movie-form">
          <div class="form-group">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex: Interestelar" required />
          </div>
          <div class="form-group">
            <label for="genero">Gênero</label>
            <input type="text" id="genero" name="genero" placeholder="Ex: Ficção Científica" required list="genero-list" />
            <datalist id="genero-list"></datalist>
          </div>
          <div class="form-group">
            <label for="nota">Nota (0 a 10)</label>
            <input type="number" id="nota" name="nota" min="0" max="10" step="0.1" placeholder="Ex: 8.5" required />
          </div>
          <button type="submit" class="btn btn-primary">Adicionar</button>
        </form>
        <p id="form-error" class="error-message" hidden></p>
      </section>

      <section class="card stats-card">
        <div class="stat">
          <span class="stat-value" id="total-filmes">0</span>
          <span class="stat-label">Filmes</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value" id="media-notas">—</span>
          <span class="stat-label">Nota Média</span>
        </div>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2>Filmes Cadastrados</h2>
          <div class="filter-group">
            <label for="filtro-genero">Filtrar por gênero:</label>
            <select id="filtro-genero">
              <option value="">Todos</option>
            </select>
          </div>
        </div>
        <ul id="movie-list" class="movie-list"></ul>
        <p id="empty-state" class="empty-state" hidden>Nenhum filme cadastrado ainda.</p>
      </section>
    </div>
  </body>
</html>
